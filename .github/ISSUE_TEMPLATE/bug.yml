name: Bug report
description: Something in Addelio doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **This is public.** Don't include email content: no message text, email addresses, subjects, attachments or screenshots of your inbox. For anything private, email support@addelio.com.
  - type: input
    id: version
    attributes:
      label: Addelio version
      description: Settings ▸ About ▸ Version
      placeholder: "0.186.0 (a1b2c3d)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.1"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included any email content, email addresses, subjects or attachments.
          required: true
