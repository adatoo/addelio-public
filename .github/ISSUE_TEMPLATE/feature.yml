name: Feature idea
description: Something Addelio could do better or differently.
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        **This is public.** Don't include email content, addresses or attachments.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or situation, rather than the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included any email content, email addresses, subjects or attachments.
          required: true
